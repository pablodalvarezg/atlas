name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      # npm 11 only runs the install scripts listed in package.json#allowScripts.
      # unrs-resolver is one of them: without its postinstall the boundaries
      # rules resolve nothing and pass green without checking anything.
      - run: npm ci

      - run: npm run check
      - run: npm run lint

      # Build before test, not after: the thesis test asserts on the HTML that
      # `next build` writes for a token page, so the build output has to exist.
      - run: npm run build
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - run: npm test

  # The JavaScript and HTML byte budgets already run above, inside `npm test`:
  # bytes are deterministic, so they need no browser and gate every commit.
  #
  # TODO(pablo): a Lighthouse CI job for LCP and CLS against the Vercel preview
  # deploy. Those depend on a real browser over a real network, and their
  # thresholds have to come from the first deploy — writing numbers before
  # measuring is inventing data.
