<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Atlas">
  <!--
    A globe for the atlas, with a price line for its horizon.

    The outer circle is what makes the inner ellipse read as a meridian rather
    than as a narrow oval: without it the shape has nothing to be inside of.
  -->
  <rect width="64" height="64" rx="14" fill="#0e1116" />

  <g stroke="#3a4250" stroke-width="2.5" fill="none">
    <circle cx="32" cy="32" r="20" />
    <ellipse cx="32" cy="32" rx="8.5" ry="20" />
    <line x1="12" y1="32" x2="52" y2="32" />
  </g>

  <!-- The horizon: a price line that closes up, which is the whole product. -->
  <path
    d="M13 41 L 23 34 L 31 38 L 41 23 L 51 28"
    fill="none"
    stroke="#8ab4ff"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle cx="41" cy="23" r="4.5" fill="#8ab4ff" />
</svg>
